# ============================================
# VoiceFlow Marketing AI - Docker Compose
# Full stack deployment with all services
# ============================================
# NOTE: 'version' key removed — deprecated in Compose v2 (KB-010)
# Use 'docker compose' (v2, space) not 'docker-compose' (KB-019)

services:
  # Main API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceflow-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/voiceflow
      - REDIS_URL=redis://redis:6379/0
      - WHISPER_MODEL_SIZE=base
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Uncomment below for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: voiceflow-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=voiceflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: voiceflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker for async tasks
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceflow-celery
    command: celery -A src.api.tasks worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/voiceflow
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.api.tasks inspect ping --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  # Celery Beat for scheduled tasks
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceflow-beat
    command: celery -A src.api.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/voiceflow
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: voiceflow-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=voiceflow123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network

  # Flowise for AI workflows (optional)
  flowise:
    image: flowiseai/flowise:latest
    container_name: voiceflow-flowise
    ports:
      - "3001:3000"
    environment:
      - FLOWISE_USERNAME=admin
      - FLOWISE_PASSWORD=voiceflow123
    volumes:
      - flowise_data:/root/.flowise
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: voiceflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Certbot for Let's Encrypt SSL
  # Usage:
  #   First time:  docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
  #   Renew:       docker compose run --rm certbot renew
  #   Auto-renew:  Add cron: 0 3 */60 * * docker compose run --rm certbot renew && docker compose exec nginx nginx -s reload
  certbot:
    image: certbot/certbot:latest
    container_name: voiceflow-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - voiceflow-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: voiceflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: voiceflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=voiceflow123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - voiceflow-network

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  flowise_data:
  prometheus_data:
  grafana_data:
  certbot_www:
  certbot_certs:

networks:
  voiceflow-network:
    driver: bridge
