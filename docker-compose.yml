# ============================================
# VoiceFlow Marketing AI - Docker Compose
# Full stack deployment with all services
# ============================================
# NOTE: 'version' key removed — deprecated in Compose v2 (KB-010)
# Use 'docker compose' (v2, space) not 'docker-compose' (KB-019)

services:
  # Main API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceflow-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - WHISPER_MODEL_SIZE=base
    # SECURITY: DATABASE_URL, SECRET_KEY, GEMINI_API_KEY, etc. all come from
    # .env (or the Coolify environment-variable UI). Do NOT hard-code secrets
    # in this file — env_file values are not enough to override anything set
    # explicitly in the `environment:` block.
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Uncomment below for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg15
    container_name: voiceflow-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-voiceflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: do NOT publish port 5432 to the host. Containers on the same
    # Docker network reach the DB by name (`db:5432`). Exposing this on a
    # Coolify VPS would put the database directly on the public internet.
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: voiceflow-redis
    # SECURITY: do NOT publish 6379 to the host. Internal-only.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker for async tasks (src/api/tasks.py)
  #     docker compose --profile workers up
  celery-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceflow-celery
    command: celery -A src.api.tasks worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.api.tasks inspect ping --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  # Celery Beat for scheduled tasks (currently: nightly render cleanup)
  celery-beat:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceflow-beat
    command: celery -A src.api.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network

  # Voice Agent — Real-time call handler (LiveKit / PIOPIY)
  # NOT-YET-WIRED: build context `../livekit-voice-agent/` is a sibling repo
  # that must exist on the build host. Bring up behind the `voice` profile:
  #     docker compose --profile voice up
  voice-agent:
    profiles: ["voice"]
    build:
      context: ../livekit-voice-agent
      dockerfile: Dockerfile
    container_name: voiceflow-voice-agent
    ports:
      - "8001:8001"
    environment:
      - VOICEFLOW_API_URL=http://api:8000
      - TRANSPORT=piopiy
    env_file:
      - .env
    volumes:
      - voice_recordings:/app/data/recordings
      - voice_clones:/app/data/voices
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/agent/voices"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # n8n Workflow Automation — opt-in
  #     docker compose --profile tools up n8n
  n8n:
    profiles: ["tools"]
    image: n8nio/n8n:latest
    container_name: voiceflow-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:?N8N_USER must be set in .env}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:?N8N_PASSWORD must be set in .env}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network

  # Flowise for AI workflows — opt-in
  flowise:
    profiles: ["tools"]
    image: flowiseai/flowise:latest
    container_name: voiceflow-flowise
    ports:
      - "3001:3000"
    environment:
      - FLOWISE_USERNAME=${FLOWISE_USER:?FLOWISE_USER must be set in .env}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD:?FLOWISE_PASSWORD must be set in .env}
    volumes:
      - flowise_data:/root/.flowise
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network

  # Nginx Reverse Proxy — opt-in
  # NOT-YET-WIRED: requires `deployment/nginx.conf` to exist in the repo. On
  # Coolify, prefer the built-in Traefik proxy (handles TLS automatically).
  #     docker compose --profile proxy up
  nginx:
    profiles: ["proxy"]
    image: nginx:alpine
    container_name: voiceflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Certbot for Let's Encrypt SSL
  # Usage:
  #   First time:  docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
  #   Renew:       docker compose run --rm certbot renew
  #   Auto-renew:  Add cron: 0 3 */60 * * docker compose run --rm certbot renew && docker compose exec nginx nginx -s reload
  certbot:
    profiles: ["proxy"]
    image: certbot/certbot:latest
    container_name: voiceflow-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - voiceflow-network

  # Prometheus for metrics — opt-in
  #     docker compose --profile monitoring up
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: voiceflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voiceflow-network

  # Grafana for dashboards — opt-in (monitoring profile)
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: voiceflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - voiceflow-network

volumes:
  postgres_data:
  redis_data:
  voice_recordings:
  voice_clones:
  n8n_data:
  flowise_data:
  prometheus_data:
  grafana_data:
  certbot_www:
  certbot_certs:

networks:
  voiceflow-network:
    driver: bridge
