global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: swetha-crm

scrape_configs:
  - job_name: swetha-crm-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
