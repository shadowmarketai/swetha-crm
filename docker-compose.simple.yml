# ============================================
# VoiceFlow Marketing AI - Simple Deployment
# MVP: Backend + SQLite (no GPU required)
# Use: docker-compose -f docker-compose.simple.yml up -d
# ============================================

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceflow-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./voiceflow.db
      - SECRET_KEY=${SECRET_KEY:-voiceflow-secret-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    env_file:
      - .env.production
    volumes:
      - voiceflow_data:/app/data
      - voiceflow_db:/app
      - voiceflow_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: voiceflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  voiceflow_data:
  voiceflow_db:
  voiceflow_logs:
