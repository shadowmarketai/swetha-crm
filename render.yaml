services:
  - type: web
    name: voiceflow-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: voiceflow-db
          property: connectionString
    autoDeploy: true

databases:
  - name: voiceflow-db
    plan: free
    databaseName: voiceflow
    user: voiceflow
